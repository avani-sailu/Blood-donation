<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find Blood Donors - BloodConnect</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="main-header">
    <div class="container navbar">
      <a href="index.html" class="nav-brand">
        <img src="assets/images/logo.png" alt="BloodConnect AI Logo" class="nav-logo">
        <div class="nav-title-group">
          <span class="nav-title">BloodConnect <span style="color:var(--color-primary); font-size:17px;">AI</span></span>
          <span class="nav-tagline">Smart Donor & Notification System</span>
        </div>
      </a>
      <ul class="nav-menu" id="navbar-menu">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="blood-requests.html" class="nav-link">Blood Requests</a></li>
        <li><a href="find-donors.html" class="nav-link active">Find Donors</a></li>
        <li><a href="donation-interest.html" class="nav-link">Donation Posts</a></li>
      </ul>
      <div class="nav-auth-buttons" id="navbar-auth-section"></div>
      <button class="hamburger" id="hamburger-btn">☰</button>
    </div>
  </header>

  <div class="container" style="padding-top:28px; padding-bottom:60px;">
    <div class="content-header">
      <div>
        <h1 class="content-title">Find Available Donors</h1>
        <p class="content-subtitle">
          Found <span id="donors-count" style="font-weight:700; color:var(--color-primary);">0</span> registered voluntary donors.
        </p>
      </div>
      <a href="donation-interest.html" class="btn btn-outline btn-sm">📅 View Donor Availability Posts</a>
    </div>

    <!-- Interactive Map Radar Section (PRD Module 12 Map Integration) -->
    <div class="dash-card" style="padding:16px; margin-bottom:24px;">
      <div class="dash-card-header" style="margin-bottom:12px; padding-bottom:8px;">
        <h3 class="dash-card-title">Interactive Donor Geographic Radar</h3>
        <span style="font-size:12px; color:var(--color-text-muted);">Real-time donor coordinates visualization</span>
      </div>
      <div id="donors-map-canvas">
        <!-- Injected via donors.js -->
      </div>
    </div>

    <!-- Filter Bar (PRD Module 12) -->
    <div class="filter-bar">
      <div class="filter-search-box">
        <input type="text" id="donor-search" class="form-control" placeholder="Search donors by name, city...">
      </div>

      <select id="donor-filter-blood" class="filter-select">
        <option value="">All Blood Groups</option>
        <option value="A+">A+</option>
        <option value="A-">A-</option>
        <option value="B+">B+</option>
        <option value="B-">B-</option>
        <option value="AB+">AB+</option>
        <option value="AB-">AB-</option>
        <option value="O+">O+</option>
        <option value="O-">O-</option>
      </select>

      <select id="donor-filter-avail" class="filter-select">
        <option value="">All Availability</option>
        <option value="Available">Available Only</option>
        <option value="Unavailable">Unavailable</option>
      </select>

      <input type="text" id="donor-filter-city" class="filter-select" placeholder="City (e.g. Mumbai)" style="min-width:140px;">
    </div>

    <!-- Donor Cards Grid -->
    <div class="requests-grid" id="donors-grid">
      <!-- Injected via donors.js -->
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/main.js"></script>
  <script src="js/donors.js"></script>
</body>
</html>
