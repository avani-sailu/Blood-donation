<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - BloodConnect</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="main-header">
    <div class="container navbar">
      <a href="index.html" class="nav-brand">
        <img src="assets/images/logo.png" alt="BloodConnect AI Logo" class="nav-logo">
        <div class="nav-title-group">
          <span class="nav-title">BloodConnect <span style="color:var(--color-primary); font-size:17px;">AI</span></span>
          <span class="nav-tagline">Smart Donor & Notification System</span>
        </div>
      </a>
      <div class="nav-auth-buttons">
        <span style="font-size:13.5px; color:var(--color-text-muted);">Don't have an account?</span>
        <a href="signup.html" class="btn btn-outline btn-sm">Sign Up</a>
      </div>
    </div>
  </header>

  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <img src="assets/images/logo.png" alt="BloodConnect" class="auth-logo">
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Log in to manage your blood requests & donor actions</p>
      </div>

      <!-- Quick Demo Login Buttons for Evaluators (PRD 3.5 & 16) -->
      <div class="demo-box">
        <div class="demo-title">
          <span>⚡</span> Quick Demo 1-Click Login:
        </div>
        <div class="demo-buttons">
          <button type="button" id="demo-btn-requester" class="btn-demo" title="John Doe - Requester & Donor">
            👤 Requester
          </button>
          <button type="button" id="demo-btn-donor" class="btn-demo" title="Sarah Jenkins - Registered Donor">
            🩸 Donor
          </button>
          <button type="button" id="demo-btn-admin" class="btn-demo" title="Dr. Sharma - Platform Admin">
            🛡️ Admin
          </button>
        </div>
      </div>

      <div class="auth-divider">
        <span>Or enter credentials</span>
      </div>

      <div id="login-error" class="form-feedback error" style="display:none; margin-bottom:14px; background:#FFEBEE; padding:10px; border-radius:var(--radius-sm); border:1px solid #FFCDD2;"></div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-identifier">Email Address or Phone Number <span class="required">*</span></label>
          <input type="text" id="login-identifier" class="form-control" placeholder="e.g. john@example.com or 9876543210" required>
        </div>

        <div class="form-group">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
            <label class="form-label" for="login-password" style="margin-bottom:0;">Password <span class="required">*</span></label>
            <a href="forgot-password.html" style="font-size:12.5px;">Forgot Password?</a>
          </div>
          <div class="password-input-group">
            <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
            <button type="button" class="password-toggle-btn" data-target="login-password" title="Show/Hide Password">👁</button>
          </div>
        </div>

        <div class="form-group" style="margin:16px 0 24px;">
          <label class="checkbox-label">
            <input type="checkbox" id="login-remember" checked>
            <span>Remember me on this browser</span>
          </label>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg">Log In</button>
      </form>

      <div class="auth-footer">
        New to BloodConnect? <a href="signup.html">Create a free account</a>
      </div>
    </div>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
