<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Blood Request - BloodConnect</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="main-header">
    <div class="container navbar">
      <a href="index.html" class="nav-brand">
        <img src="assets/images/logo.png" alt="BloodConnect AI Logo" class="nav-logo">
        <div class="nav-title-group">
          <span class="nav-title">BloodConnect <span style="color:var(--color-primary); font-size:17px;">AI</span></span>
          <span class="nav-tagline">Smart Donor & Notification System</span>
        </div>
      </a>
      <div class="nav-auth-buttons" id="navbar-auth-section"></div>
    </div>
  </header>

  <div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="sidebar-link">
          <div class="sidebar-link-content"><span>📊</span> Dashboard</div>
        </a>
        <a href="create-request.html" class="sidebar-link active">
          <div class="sidebar-link-content"><span>➕</span> Create Request</div>
        </a>
        <a href="blood-requests.html" class="sidebar-link">
          <div class="sidebar-link-content"><span>🔍</span> View Blood Requests</div>
        </a>
        <a href="my-requests.html" class="sidebar-link">
          <div class="sidebar-link-content"><span>📋</span> My Requests</div>
        </a>
        <a href="find-donors.html" class="sidebar-link">
          <div class="sidebar-link-content"><span>🩸</span> Find Donors</div>
        </a>
        <a href="accepted-requests.html" class="sidebar-link">
          <div class="sidebar-link-content"><span>🤝</span> Accepted Requests</div>
        </a>
        <a href="messages.html" class="sidebar-link">
          <div class="sidebar-link-content"><span>💬</span> Messages</div>
        </a>
        <a href="notifications.html" class="sidebar-link">
          <div class="sidebar-link-content"><span>🔔</span> Notifications</div>
        </a>
      </nav>
      <div class="sidebar-footer">
        <button onclick="handleLogout()" class="btn btn-secondary btn-block btn-sm">🚪 Logout</button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <div class="content-header">
        <div>
          <h1 class="content-title">Publish Blood Requirement</h1>
          <p class="content-subtitle">Fill in the details below to broadcast an emergency blood request to verified donors.</p>
        </div>
      </div>

      <div class="dash-card" style="max-width:860px; margin:0 auto;">
        <form id="create-request-form">
          <!-- Patient Name & Blood Group -->
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="req-patient-name">Patient Name <span class="required">*</span></label>
              <input type="text" id="req-patient-name" class="form-control" placeholder="e.g. Ramesh Kumar" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="req-blood-group">Required Blood Group <span class="required">*</span></label>
              <select id="req-blood-group" class="form-control" required>
                <option value="" disabled selected>Select Blood Group</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
              </select>
            </div>
          </div>

          <!-- Required Units & Urgency Level -->
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="req-units">Required Units (Pints / Bags) <span class="required">*</span></label>
              <input type="number" id="req-units" class="form-control" min="1" max="20" value="1" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="req-date">Required By Date <span class="required">*</span></label>
              <input type="date" id="req-date" class="form-control" required>
            </div>
          </div>

          <!-- Urgency Level Selection (PRD Module 6) -->
          <div class="form-group">
            <label class="form-label">Emergency Urgency Level <span class="required">*</span></label>
            <div class="radio-cards-group">
              <label class="radio-card radio-card-critical">
                <input type="radio" name="urgency" value="Critical" checked>
                <div class="radio-card-content">
                  <div style="font-size:18px;">🚨</div>
                  <div>Critical</div>
                  <small style="font-size:11px; opacity:0.8;">Surgery / ICU emergency</small>
                </div>
              </label>

              <label class="radio-card radio-card-urgent">
                <input type="radio" name="urgency" value="Urgent">
                <div class="radio-card-content">
                  <div style="font-size:18px;">⚠️</div>
                  <div>Urgent</div>
                  <small style="font-size:11px; opacity:0.8;">Required within 24-48 hrs</small>
                </div>
              </label>

              <label class="radio-card radio-card-normal">
                <input type="radio" name="urgency" value="Normal">
                <div class="radio-card-content">
                  <div style="font-size:18px;">ℹ️</div>
                  <div>Normal</div>
                  <small style="font-size:11px; opacity:0.8;">Planned medical procedure</small>
                </div>
              </label>
            </div>
          </div>

          <!-- Hospital Information -->
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="req-hospital-name">Hospital Name <span class="required">*</span></label>
              <input type="text" id="req-hospital-name" class="form-control" placeholder="e.g. City Care Hospital" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="req-contact-phone">Contact Phone Number <span class="required">*</span></label>
              <input type="tel" id="req-contact-phone" class="form-control" placeholder="+91 98765 43210" required>
            </div>
          </div>

          <!-- Location Details -->
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="req-city">City <span class="required">*</span></label>
              <input type="text" id="req-city" class="form-control" placeholder="e.g. Mumbai" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="req-district">District</label>
              <input type="text" id="req-district" class="form-control" placeholder="e.g. Mumbai Suburban">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="req-hospital-address">Hospital Address & Ward / Floor</label>
            <input type="text" id="req-hospital-address" class="form-control" placeholder="e.g. 3rd Floor Blood Bank, SV Road, Andheri West">
          </div>

          <!-- Additional Description -->
          <div class="form-group">
            <label class="form-label" for="req-description">Additional Description / Medical Case Summary</label>
            <textarea id="req-description" class="form-control" placeholder="Provide any additional clinical instructions, patient bed number, or contact timings."></textarea>
          </div>

          <div style="display:flex; justify-content:flex-end; gap:12px; margin-top:28px;">
            <a href="dashboard.html" class="btn btn-secondary btn-sm">Cancel</a>
            <button type="submit" class="btn btn-primary btn-lg">🚀 Publish Blood Request</button>
          </div>
        </form>
      </div>
    </main>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/main.js"></script>
  <script src="js/requests.js"></script>
  <script>
    // Set default date to tomorrow
    const tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);
    document.getElementById('req-date').value = tomorrow.toISOString().split('T')[0];
  </script>
</body>
</html>
