<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>View Blood Requests - BloodConnect</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="main-header">
    <div class="container navbar">
      <a href="index.html" class="nav-brand">
        <img src="assets/images/logo.png" alt="BloodConnect AI Logo" class="nav-logo">
        <div class="nav-title-group">
          <span class="nav-title">BloodConnect <span style="color:var(--color-primary); font-size:17px;">AI</span></span>
          <span class="nav-tagline">Smart Donor & Notification System</span>
        </div>
      </a>
      <ul class="nav-menu" id="navbar-menu">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="blood-requests.html" class="nav-link active">Blood Requests</a></li>
        <li><a href="find-donors.html" class="nav-link">Find Donors</a></li>
        <li><a href="donation-interest.html" class="nav-link">Donation Posts</a></li>
      </ul>
      <div class="nav-auth-buttons" id="navbar-auth-section"></div>
      <button class="hamburger" id="hamburger-btn">☰</button>
    </div>
  </header>

  <div class="container" style="padding-top:30px; padding-bottom:50px;">
    <div class="content-header">
      <div>
        <h1 class="content-title">Available Blood Requests</h1>
        <p class="content-subtitle">
          Showing <span id="requests-found-count" style="font-weight:700; color:var(--color-primary);">0</span> active requests in need of donors.
        </p>
      </div>
      <a href="create-request.html" class="btn btn-primary btn-sm">➕ Post New Request</a>
    </div>

    <!-- Search & Filter Bar (PRD Module 7) -->
    <div class="filter-bar">
      <div class="filter-search-box">
        <input type="text" id="filter-search" class="form-control" placeholder="Search by patient name, hospital, city...">
      </div>

      <select id="filter-blood-group" class="filter-select">
        <option value="">All Blood Groups</option>
        <option value="A+">A+</option>
        <option value="A-">A-</option>
        <option value="B+">B+</option>
        <option value="B-">B-</option>
        <option value="AB+">AB+</option>
        <option value="AB-">AB-</option>
        <option value="O+">O+</option>
        <option value="O-">O-</option>
      </select>

      <select id="filter-urgency" class="filter-select">
        <option value="">All Urgency Levels</option>
        <option value="Critical">Critical</option>
        <option value="Urgent">Urgent</option>
        <option value="Normal">Normal</option>
      </select>

      <select id="filter-status" class="filter-select">
        <option value="">All Statuses</option>
        <option value="Open">Open</option>
        <option value="Donor Interested">Donor Interested</option>
        <option value="Donor Selected">Donor Selected</option>
        <option value="In Progress">In Progress</option>
        <option value="Completed">Completed</option>
      </select>

      <input type="text" id="filter-city" class="filter-select" placeholder="Filter by City" style="min-width:130px;">
    </div>

    <!-- Requests Grid -->
    <div class="requests-grid" id="blood-requests-grid">
      <!-- Injected dynamically via requests.js -->
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/main.js"></script>
  <script src="js/requests.js"></script>
</body>
</html>
